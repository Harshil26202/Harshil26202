name: AI Weekly Log

on:
  schedule:
    - cron: "30 3 * * *"   # daily at 03:30 UTC (09:00 IST)
  workflow_dispatch:         # allows manual trigger from Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install anthropic

      - name: Summarize the last 14 days of commits
        run: python scripts/ai_weekly_log.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit if the README changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore(ai-log): refresh weekly summary"
          git push
